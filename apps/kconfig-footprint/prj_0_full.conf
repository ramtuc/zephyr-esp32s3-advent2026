# 出発点: シェル・ロギング・ネットワーク（Wi-Fi）を全部入れた構成
CONFIG_GPIO=y

# ロギング
CONFIG_LOG=y

# シェル
CONFIG_SHELL=y

# ネットワークと Wi-Fi（値は Zephyr の samples/net/wifi/shell の prj.conf から）
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SHELL=y
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_SHELL_STACK_SIZE=5200
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
