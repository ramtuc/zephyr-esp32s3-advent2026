sample:
  name: sensor-fetch-get
  description: BME280 をセンサ API の Fetch/Get で読む
common:
  platform_allow:
    - esp32s3_devkitc/esp32s3/procpu
  integration_platforms:
    - esp32s3_devkitc/esp32s3/procpu
  build_only: true
  tags: advent2026
tests:
  advent.sensor_fetch_get: {}
  # BME280 を forced モードで動かすビルド
  advent.sensor_fetch_get.forced:
    extra_configs:
      - CONFIG_BME280_MODE_FORCED=y
  # 温度センサを SHT4x に替えるビルド
  advent.sensor_fetch_get.sht4x:
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=sht4x.overlay
