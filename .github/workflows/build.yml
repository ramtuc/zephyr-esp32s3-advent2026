# apps/ 以下のアプリを、push と pull request のたびに ESP32-S3 向けにビルドする
# SPDX-License-Identifier: Apache-2.0

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build apps (esp32s3_devkitc)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zephyr-esp32s3-advent2026
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@cc223fe61661d8573c1cd3f95f72f90cce729ae9 # v1.0.16
        with:
          app-path: zephyr-esp32s3-advent2026
          toolchains: xtensa-espressif_esp32s3_zephyr-elf
          ccache-cache-key: esp32s3

      # Wi-Fi 入りのビルドは、hal_espressif の blob が全部そろっているかを確かめる。
      # --allow-regex で ESP32-S3 の分だけに絞ると、そこで止まるので全部取る。
      - name: Fetch Espressif blobs
        run: west blobs fetch hal_espressif

      - name: Build apps with twister
        working-directory: zephyr-esp32s3-advent2026
        run: west twister -T apps -v --inline-logs --integration

      - name: Footprint summary
        if: always()
        working-directory: zephyr-esp32s3-advent2026
        run: |
          echo "## メモリの使用量（build.log の Memory region）" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/footprint_summary.py twister-out >> "$GITHUB_STEP_SUMMARY"

      - name: Print ccache stats
        if: always()
        run: ccache -s -v

      - name: Upload twister report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twister-report
          path: |
            zephyr-esp32s3-advent2026/twister-out/twister.json
            zephyr-esp32s3-advent2026/twister-out/twister.xml
          if-no-files-found: ignore

  sca:
    name: Static analysis (GCC -fanalyzer)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zephyr-esp32s3-advent2026
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@cc223fe61661d8573c1cd3f95f72f90cce729ae9 # v1.0.16
        with:
          app-path: zephyr-esp32s3-advent2026
          toolchains: xtensa-espressif_esp32s3_zephyr-elf
          ccache-cache-key: esp32s3-sca

      - name: Fetch Espressif blobs
        run: west blobs fetch hal_espressif

      # Zephyr 本体のコードにも解析の指摘が出るので、twister の「警告をエラーにする」を外し（-W）、
      # 自分のコード（このリポジトリ）の指摘だけで失敗にする（scripts/sca_report.py）。
      - name: Build apps with GCC static analyzer
        working-directory: zephyr-esp32s3-advent2026
        run: west twister -T apps -v --inline-logs --integration -W -x=ZEPHYR_SCA_VARIANT=gcc

      - name: Static analysis report
        working-directory: zephyr-esp32s3-advent2026
        run: |
          rc=0
          python3 scripts/sca_report.py twister-out . > sca_report.md || rc=$?
          echo "## GCC の静的解析" >> "$GITHUB_STEP_SUMMARY"
          cat sca_report.md >> "$GITHUB_STEP_SUMMARY"
          cat sca_report.md
          exit $rc

  qemu:
    name: Run blinky-ext on Espressif QEMU
    runs-on: ubuntu-24.04
    env:
      QEMU_RELEASE: esp-develop-9.2.2-20260417
      QEMU_FILE: qemu-xtensa-softmmu-esp_develop_9.2.2_20260417-x86_64-linux-gnu.tar.xz
      QEMU_SHA256: 0eecb2a34a5586c0e59110f77b9343b7b336e82fdb0e1a30e1dc1bab8a547e35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zephyr-esp32s3-advent2026
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@cc223fe61661d8573c1cd3f95f72f90cce729ae9 # v1.0.16
        with:
          app-path: zephyr-esp32s3-advent2026
          toolchains: xtensa-espressif_esp32s3_zephyr-elf
          ccache-cache-key: esp32s3-qemu

      - name: Install Espressif QEMU
        run: |
          sudo apt-get install -y libsdl2-2.0-0 libslirp0
          wget -q "https://github.com/espressif/qemu/releases/download/${QEMU_RELEASE}/${QEMU_FILE}"
          echo "${QEMU_SHA256}  ${QEMU_FILE}" | sha256sum -c
          mkdir -p "$HOME/opt"
          tar -xf "${QEMU_FILE}" -C "$HOME/opt"
          echo "ESPRESSIF_QEMU_PATH=$HOME/opt/qemu/bin" >> "$GITHUB_ENV"

      - name: Build blinky-ext for the QEMU target
        run: west build -b esp32s3_devkitc/esp32s3/procpu/qemu -d build-qemu zephyr-esp32s3-advent2026/apps/blinky-ext

      # QEMU は自分では終わらないので、時間を区切って止め、出力に LED の行があるかを確かめる
      - name: Run on QEMU
        run: |
          timeout 30 west build -d build-qemu -t run < /dev/null > qemu.log 2>&1 || true
          cat qemu.log
          grep -q "LED state: ON" qemu.log
